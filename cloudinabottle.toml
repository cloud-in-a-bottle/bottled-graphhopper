[app]
name = "graphhopper"
version = "1.0.0"
description = "GraphHopper — self-hosted routing engine with built-in map UI. Supports car, bike, and foot navigation with turn-by-turn directions."
authors = ["Andrew Laack <andrew@laack.co>"]

[runtime.container]
image = "Dockerfile"
# Cloud in a Bottle pulls this signed prebuilt image (built from the release tag's commit by CI) instead of building
# `image`. If you fork this app and change it, comment this line out so your instance builds `image` instead.
prebuilt_image = "registry.cloudinabottle.org/bottled-graphhopper"
port = 8080

[routing]
health_check = "/healthz"

[resources]
memory_mb = 12288
cpu_millicores = 2000

[data]
app_data = true
app_temp_data = true
